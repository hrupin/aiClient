name: Publish aiClient to Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: Install Android SDK platform
        run: |
          sdk_root="${ANDROID_HOME:?The runner does not define ANDROID_HOME}"
          if [[ -f "$sdk_root/platforms/android-37.0/android.jar" ]]; then
            echo "Android SDK Platform 37.0 is already installed."
            exit 0
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "::error::Android sdkmanager is missing at $sdkmanager"
            exit 1
          fi
          "$sdkmanager" --sdk_root="$sdk_root" --install 'platforms;android-37.0'
      - name: Run JVM tests and stage signed publications
        env:
          CENTRAL_SIGNING_KEY: ${{ secrets.CENTRAL_SIGNING_KEY }}
          CENTRAL_SIGNING_PASSWORD: ${{ secrets.CENTRAL_SIGNING_PASSWORD }}
          CENTRAL_LICENSE_NAME: ${{ vars.CENTRAL_LICENSE_NAME }}
          CENTRAL_LICENSE_URL: ${{ vars.CENTRAL_LICENSE_URL }}
        run: |
          : "${CENTRAL_SIGNING_KEY:?Set the CENTRAL_SIGNING_KEY secret}"
          : "${CENTRAL_LICENSE_NAME:?Set the CENTRAL_LICENSE_NAME repository variable}"
          : "${CENTRAL_LICENSE_URL:?Set the CENTRAL_LICENSE_URL repository variable}"
          ./gradlew --no-configuration-cache jvmTest \
            :core:publishAllPublicationsToCentralStagingRepository \
            :application:publishAllPublicationsToCentralStagingRepository \
            :infrastructure:publishAllPublicationsToCentralStagingRepository
          release_version=$(sed -n 's/^aiClientVersion=//p' gradle.properties)
          python3 scripts/build-central-bundle.py build/central-staging "$release_version" build/central-bundle.zip
      - name: Upload and publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          : "${CENTRAL_USERNAME:?Set the CENTRAL_USERNAME secret}"
          : "${CENTRAL_PASSWORD:?Set the CENTRAL_PASSWORD secret}"
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')
          echo "::add-mask::$token"
          api=https://central.sonatype.com/api/v1/publisher
          deployment=$(curl --fail-with-body --silent --show-error --max-time 180 \
            --header "Authorization: Bearer $token" \
            --form 'bundle=@build/central-bundle.zip;type=application/octet-stream' \
            "$api/upload?publishingType=AUTOMATIC")
          echo "Central deployment: $deployment"
          for attempt in {1..120}; do
            status=$(curl --fail-with-body --silent --show-error --max-time 30 --retry 3 \
              --request POST --header "Authorization: Bearer $token" \
              "$api/status?id=$deployment")
            state=$(jq -er '.deploymentState' <<< "$status")
            echo "Central deployment state: $state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) jq '.errors' <<< "$status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for deployment $deployment."
          exit 1
